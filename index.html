<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Stream Live Translator & Chat TL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .subtitle-shadow {
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.95), -1px -1px 2px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col overflow-hidden">

  <!-- Top Navigation & Controls -->
  <header class="bg-zinc-900 border-b border-zinc-800 p-3 flex flex-wrap items-center gap-3">
    <h1 class="font-bold text-base text-rose-400 tracking-wide">JP Stream TL</h1>
    
    <input id="ytUrlInput" type="text" placeholder="Paste YouTube Live URL or Video ID..." 
      class="flex-1 min-w-[220px] bg-zinc-800 border border-zinc-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-rose-500" />
    
    <button onclick="loadStream()" class="bg-rose-600 hover:bg-rose-500 px-3.5 py-1.5 rounded text-sm font-medium transition">
      Load Stream
    </button>

    <button id="captureBtn" onclick="toggleAudioCapture()" class="bg-emerald-600 hover:bg-emerald-500 px-3.5 py-1.5 rounded text-sm font-medium transition">
      🎙️ Start Voice TL
    </button>

    <button onclick="toggleSettings()" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded text-sm border border-zinc-700">
      ⚙️ API Keys
    </button>
  </header>

  <!-- Main Layout: Video on Left, Chat on Right -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
    
    <!-- Video Player & Subtitle Area -->
    <div class="relative flex-1 bg-black flex items-center justify-center">
      <div id="player" class="w-full h-full"></div>

      <!-- Floating Subtitle Overlay -->
      <div id="subtitleBox" class="absolute bottom-12 left-1/2 -translate-x-1/2 w-11/12 max-w-3xl text-center pointer-events-none space-y-1">
        <p id="jpText" class="text-xs md:text-sm text-zinc-300 bg-black/60 inline-block px-3 py-0.5 rounded subtitle-shadow"></p>
        <br />
        <p id="enText" class="text-base md:text-xl font-bold text-yellow-300 bg-black/75 inline-block px-4 py-1 rounded subtitle-shadow">
          Load a Japanese stream and click "Start Voice TL" to begin...
        </p>
      </div>
    </div>

    <!-- Live Chat Sidebar -->
    <aside class="w-full lg:w-96 bg-zinc-900 border-l border-zinc-800 flex flex-col h-72 lg:h-full">
      <div class="p-3 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/50">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Live Chat</span>
        <div class="flex items-center gap-2">
          <label class="text-xs text-zinc-400 flex items-center gap-1 cursor-pointer">
            <input type="checkbox" id="translateChatToggle" class="rounded bg-zinc-800 border-zinc-700 text-rose-500 focus:ring-0">
            Translate Chat (EN)
          </label>
          <span id="chatStatus" class="text-xs text-zinc-500">Idle</span>
        </div>
      </div>
      <div id="chatContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5 text-sm"></div>
    </aside>
  </main>

  <!-- API Keys Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-700 rounded-lg max-w-md w-full p-5 space-y-4 shadow-xl">
      <h2 class="text-lg font-bold">API Configuration</h2>
      <p class="text-xs text-zinc-400">Keys are stored securely in your browser's local storage and never shared.</p>
      <div>
        <label class="block text-xs text-zinc-300 mb-1 font-medium">Gemini API Key (For Audio & Chat Translation)</label>
        <input id="geminiKeyInput" type="password" placeholder="AIzaSy..." class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-rose-500" />
      </div>
      <div>
        <label class="block text-xs text-zinc-300 mb-1 font-medium">YouTube Data API v3 Key (For Live Chat)</label>
        <input id="ytKeyInput" type="password" placeholder="AIzaSy..." class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-rose-500" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleSettings()" class="px-4 py-1.5 rounded bg-zinc-800 text-sm hover:bg-zinc-700">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-1.5 rounded bg-rose-600 text-sm font-medium hover:bg-rose-500">Save Keys</button>
      </div>
    </div>
  </div>

  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let chatInterval;
    let nextPageToken = '';
    let liveChatId = '';
    let mediaRecorder;
    let isCapturing = false;
    let captureStream;

    // Sliding context memory for voice translation (stores last 2 entries)
    let translationHistory = [];

    window.onload = () => {
      document.getElementById('geminiKeyInput').value = localStorage.getItem('GEMINI_KEY') || '';
      document.getElementById('ytKeyInput').value = localStorage.getItem('YT_KEY') || '';
    };

    function toggleSettings() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function saveSettings() {
      localStorage.setItem('GEMINI_KEY', document.getElementById('geminiKeyInput').value.trim());
      localStorage.setItem('YT_KEY', document.getElementById('ytKeyInput').value.trim());
      toggleSettings();
    }

    function extractVideoId(input) {
      const regExp = /(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = input.match(regExp);
      return match ? match[1] : input.trim();
    }

    function loadStream() {
      const rawInput = document.getElementById('ytUrlInput').value;
      const videoId = extractVideoId(rawInput);
      if (!videoId) return alert('Please enter a valid YouTube URL or Video ID.');

      if (player) {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: { autoplay: 1, playsinline: 1 }
        });
      }
      translationHistory = []; // Reset context on new stream
      initLiveChat(videoId);
    }

    // --- Live Chat Handling ---
    async function initLiveChat(videoId) {
      clearInterval(chatInterval);
      const ytKey = localStorage.getItem('YT_KEY');
      const statusEl = document.getElementById('chatStatus');
      const chatBox = document.getElementById('chatContainer');
      chatBox.innerHTML = '';

      if (!ytKey) {
        statusEl.textContent = 'No YT Key';
        return;
      }

      try {
        statusEl.textContent = 'Connecting...';
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${ytKey}`);
        const data = await res.json();
        liveChatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;

        if (!liveChatId) {
          statusEl.textContent = 'No active chat';
          return;
        }

        statusEl.textContent = 'Active';
        nextPageToken = '';
        fetchChatMessages();
        chatInterval = setInterval(fetchChatMessages, 5000);
      } catch (err) {
        statusEl.textContent = 'Error';
        console.error(err);
      }
    }

    async function fetchChatMessages() {
      const ytKey = localStorage.getItem('YT_KEY');
      if (!liveChatId || !ytKey) return;

      let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${liveChatId}&part=snippet,authorDetails&key=${ytKey}`;
      if (nextPageToken) url += `&pageToken=${nextPageToken}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        nextPageToken = data.nextPageToken;

        const chatBox = document.getElementById('chatContainer');
        const shouldTranslateChat = document.getElementById('translateChatToggle').checked;
        const rawItems = data.items || [];

        if (rawItems.length === 0) return;

        // If chat translation is enabled, batch translate Japanese comments
        if (shouldTranslateChat) {
          const messagesToTranslate = rawItems.map(item => ({
            id: item.id,
            author: item.authorDetails.displayName,
            msg: item.snippet.displayMessage
          }));

          translateChatBatch(messagesToTranslate, chatBox);
        } else {
          rawItems.forEach(item => {
            appendChatMessage(chatBox, item.authorDetails.displayName, item.snippet.displayMessage, '');
          });
        }
      } catch (e) {
        console.error('Chat poll error:', e);
      }
    }

    function appendChatMessage(chatBox, author, originalMsg, translatedMsg) {
      const div = document.createElement('div');
      div.className = 'leading-tight border-b border-zinc-800/50 pb-1.5';
      
      let content = `<span class="font-semibold text-rose-400 text-xs">${author}:</span> <span class="text-zinc-200">${originalMsg}</span>`;
      if (translatedMsg) {
        content += `<br/><span class="text-yellow-400/90 text-xs italic">↳ ${translatedMsg}</span>`;
      }
      div.innerHTML = content;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function translateChatBatch(messages, chatBox) {
      const geminiKey = localStorage.getItem('GEMINI_KEY');
      if (!geminiKey) {
        messages.forEach(m => appendChatMessage(chatBox, m.author, m.msg, ''));
        return;
      }

      try {
        const prompt = `Translate these YouTube livestream chat messages into natural English. Keep proper names, VTuber names, and gamer slang intact (do not literally translate names like Matsuri into festival). Return a JSON array of objects with keys 'id' and 'translated'. Messages: ${JSON.stringify(messages)}`;
        
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        const data = await response.json();
        const textRes = data.candidates?.[0]?.content?.parts?.[0]?.text;
        const translations = textRes ? JSON.parse(textRes) : [];
        const transMap = {};
        translations.forEach(t => transMap[t.id] = t.translated);

        messages.forEach(m => {
          appendChatMessage(chatBox, m.author, m.msg, transMap[m.id] || '');
        });
      } catch (err) {
        console.error('Chat translation failed:', err);
        messages.forEach(m => appendChatMessage(chatBox, m.author, m.msg, ''));
      }
    }

    // --- Audio Capture & Gemini Voice Translation ---
    async function toggleAudioCapture() {
      const btn = document.getElementById('captureBtn');
      const geminiKey = localStorage.getItem('GEMINI_KEY');

      if (!geminiKey) {
        alert('Please enter your Gemini API Key in Settings first.');
        return toggleSettings();
      }

      if (isCapturing) {
        isCapturing = false;
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (captureStream) captureStream.getTracks().forEach(t => t.stop());
        btn.textContent = '🎙️ Start Voice TL';
        btn.classList.replace('bg-red-600', 'bg-emerald-600');
        return;
      }

      try {
        captureStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        const audioTracks = captureStream.getAudioTracks();
        if (!audioTracks.length) {
          alert('No audio track shared! Remember to check "Share tab audio" in the browser prompt.');
          captureStream.getTracks().forEach(t => t.stop());
          return;
        }

        captureStream.getVideoTracks().forEach(t => t.stop()); // Discard heavy video track
        const audioStream = new MediaStream(audioTracks);

        isCapturing = true;
        btn.textContent = '⏹️ Stop Voice TL';
        btn.classList.replace('bg-emerald-600', 'bg-red-600');

        recordChunkLoop(audioStream, geminiKey);
      } catch (err) {
        console.error('Audio capture cancelled or blocked:', err);
      }
    }

    function recordChunkLoop(audioStream, geminiKey) {
      if (!isCapturing) return;

      const recorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = async () => {
        if (chunks.length > 0) {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          await processAudioWithGemini(blob, geminiKey);
        }
        if (isCapturing) recordChunkLoop(audioStream, geminiKey);
      };

      recorder.start();
      // 5-second chunks give optimal balance between latency and context length
      setTimeout(() => {
        if (recorder.state === 'recording') recorder.stop();
      }, 5000);
    }

    async function processAudioWithGemini(audioBlob, geminiKey) {
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        const contextString = translationHistory.length > 0 
          ? `Recent previous context: ${JSON.stringify(translationHistory)}` 
          : "This is the start of the stream.";

        try {
          const prompt = `You are a professional Japanese livestream translator. Listen to this audio clip. 
          Note: Ignore background game music, game sound effects, or other distracting noises. Focus strictly on the main streamer's voice.
          ${contextString}
          Task: Return a JSON object with 'jp' (Japanese transcription) and 'en' (natural English translation keeping streamer slang, names, and tone intact). If there is only music or no speech, return {"jp": "", "en": ""}.`;

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: prompt },
                    { inlineData: { mimeType: "audio/webm", data: base64Audio } }
                  ]
                }],
                generationConfig: { responseMimeType: "application/json" }
              })
            }
          );

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) return;

          const parsed = JSON.parse(rawText);
          if (parsed.en && parsed.en.trim() !== "") {
            document.getElementById('jpText').textContent = parsed.jp;
            document.getElementById('enText').textContent = parsed.en;

            // Keep last 2 translations in history for pronoun and joke continuity
            translationHistory.push(parsed.en);
            if (translationHistory.length > 2) translationHistory.shift();
          }
        } catch (err) {
          console.error('Voice translation error:', err);
        }
      };
    }
  </script>
</body>
</html>
